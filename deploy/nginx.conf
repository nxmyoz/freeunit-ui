# nginx in front of freeunit-ui.
#
# Client certificates are used here because the operator set is small and it
# removes passwords, sessions and phishing from the picture entirely. Any other
# scheme works as long as two things hold:
#
#   1. no request reaches the application unauthenticated, and
#   2. the identity header is set by nginx, never passed through from a client.
#
# proxy_set_header below satisfies (2): it replaces whatever the client sent.

# nginx has no CN-only variable, so pull it out of the subject DN.
map $ssl_client_s_dn $freeunit_ui_user {
    default            "";
    "~,?CN=(?<cn>[^,]+)" $cn;
}

server {
    listen 443 ssl;
    http2 on;
    server_name unit.example.org;

    ssl_certificate     /etc/ssl/certs/unit-ui.pem;
    ssl_certificate_key /etc/ssl/private/unit-ui.key;

    # Only holders of a certificate signed by this CA get past here.
    ssl_client_certificate /etc/ssl/certs/operators-ca.pem;
    ssl_verify_client      on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://unix:/run/freeunit-ui/ui.sock;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Asserted by nginx after ssl_verify_client. This replaces any header the
        # client tried to send, which is what makes it trustworthy downstream.
        proxy_set_header X-Forwarded-User  $freeunit_ui_user;
    }

    # The application answers this without touching the control socket, so it
    # reflects the interface being up rather than FreeUnit being up.
    location = /healthz {
        proxy_pass http://unix:/run/freeunit-ui/ui.sock;
        access_log off;
    }
}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freeunit-ui"
version = "0.1.0"
description = "A web interface for the FreeUnit (NGINX Unit) control API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "vd", email = "v@9dt.de" }]
keywords = ["freeunit", "nginx-unit", "web-server", "configuration", "flask"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.7"]

# [project.urls] is intentionally absent: this is not published yet.

[project.scripts]
freeunit-ui = "freeunit_ui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freeunit_ui"]
artifacts = ["src/freeunit_ui/py.typed", "src/freeunit_ui/schema/*.json", "src/freeunit_ui/schema/VERSION"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "S",         # bandit (security)
    "PT",        # pytest style
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",
    "ANN",       # type annotations
    "D",         # docstrings
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "ANN401", # allow Any where the control API genuinely returns arbitrary JSON
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts and need no docstrings on every case.
"tests/**" = ["S101", "S105", "S106", "D100", "D101", "D102", "D103", "D104", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# PyYAML is only used by the vendoring script, which is not shipped.
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # httpx leaks the socket when a UNIX-domain connect fails (reproducible with
    # httpx alone, no code of ours involved), so this one warning is downgraded
    # rather than masking leaks we could actually fix.
    "default:unclosed:ResourceWarning",
]

[tool.coverage.run]
source = ["src/freeunit_ui"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 90
